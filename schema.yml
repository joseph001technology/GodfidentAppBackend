openapi: 3.0.3
info:
  title: Godfident API
  version: 1.0.0
  description: Personal Bible Study & Spiritual Growth Platform
paths:
  /api/achievements/:
    get:
      operationId: api_achievements_list
      description: View the current user's achievements and progress.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserAchievementList'
          description: ''
  /api/achievements/{id}/:
    get:
      operationId: api_achievements_retrieve
      description: View the current user's achievements and progress.
      parameters:
