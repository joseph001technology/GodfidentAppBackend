components:
  schemas:
    Achievement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 50
        title:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        icon:
          type: string
          maxLength: 100
        criteria_description:
          type: string
          maxLength: 300
        threshold_value:
          type: integer
          maximum: 2147483647
          minimum: 0
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - category
      - code
      - criteria_description
      - description
      - id
      - title
    BlockedApp:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        app_name:
          type: string
          maxLength: 200
        package_name:
          type: string
          maxLength: 300
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - app_name
      - created_at
      - id
      - package_name
    BlockedAttempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session:
          type: integer
          nullable: true
        target_type:
          $ref: '#/components/schemas/TargetTypeEnum'
        target_name:
          type: string
          maxLength: 300
        attempted_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempted_at
      - id
      - target_name
      - target_type
    BlockedWebsite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 500
        domain:
          type: string
          maxLength: 300
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - domain
      - id
      - url
    Book:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
          maximum: 32767
          minimum: 0
        name:
          type: string
          maxLength: 50
        abbreviation:
          type: string
          maxLength: 10
        testament:
          $ref: '#/components/schemas/TestamentEnum'
        chapter_count:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - abbreviation
      - chapter_count
      - id
      - name
      - number
      - testament
    Bookmark:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        book:
          type: integer
        book_name:
          type: string
          readOnly: true
        chapter:
          type: integer
          maximum: 32767
          minimum: 0
        verse:
          type: integer
          maximum: 32767
          minimum: 0
        note:
          type: string
        reference:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - book
      - book_name
      - chapter
      - created_at
      - id
      - reference
      - verse
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        icon:
          type: string
          maxLength: 50
      required:
      - id
      - name
    CategoryEnum:
      enum:
      - prayer
      - reading
      - notes
      - streak
      - focus
      - milestone
      - devotional
      type: string
      description: |-
        * `prayer` - Prayer
        * `reading` - Bible Reading
        * `notes` - Notes
        * `streak` - Streaks
        * `focus` - Focus
        * `milestone` - Milestones
        * `devotional` - Devotionals
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - role
    ChatSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        message_count:
          type: string
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message_count
      - messages
      - updated_at
    ColorEnum:
      enum:
      - yellow
      - green
      - blue
      - pink
      - orange
      type: string
      description: |-
        * `yellow` - Yellow
        * `green` - Green
        * `blue` - Blue
        * `pink` - Pink
        * `orange` - Orange
    CrossReference:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        to_book_name:
          type: string
          readOnly: true
        to_chapter:
          type: integer
          maximum: 32767
          minimum: 0
        to_verse:
          type: integer
          maximum: 32767
          minimum: 0
        to_verse_end:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        relevance_score:
          type: number
          format: double
        reference:
          type: string
          readOnly: true
      required:
      - id
      - reference
      - to_book_name
      - to_chapter
      - to_verse
    DayOfWeekEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    DeviceTypeEnum:
      enum:
      - android
      - ios
      - web
      type: string
      description: |-
        * `android` - Android
        * `ios` - iOS
        * `web` - Web
    Devotional:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        scripture_reference:
          type: string
          maxLength: 100
        scripture_text:
          type: string
        reflection:
          type: string
        prayer:
          type: string
        application:
          type: string
        key_takeaway:
          type: string
          maxLength: 500
        author:
          type: string
          maxLength: 100
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          readOnly: true
        publish_date:
          type: string
          format: date
          nullable: true
        is_saved:
          type: string
          readOnly: true
        is_read:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category_name
      - created_at
      - id
      - is_read
      - is_saved
      - prayer
      - reflection
      - scripture_reference
      - scripture_text
      - title
    FCMDevice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        device_type:
          $ref: '#/components/schemas/DeviceTypeEnum'
        token:
          type: string
          maxLength: 500
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - device_type
      - id
      - token
    FavoriteVerse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        book:
          type: integer
        book_name:
          type: string
          readOnly: true
        chapter:
          type: integer
          maximum: 32767
          minimum: 0
        verse:
          type: integer
          maximum: 32767
          minimum: 0
        note:
          type: string
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        reference:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - book
      - book_name
      - chapter
      - created_at
      - id
      - reference
      - verse
    FocusSchedule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        day_of_week:
          allOf:
          - $ref: '#/components/schemas/DayOfWeekEnum'
          minimum: -2147483648
          maximum: 2147483647
        day_name:
          type: string
          readOnly: true
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - day_name
      - day_of_week
      - end_time
      - id
      - start_time
    FocusSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
